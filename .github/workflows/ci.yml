name: CI Build and Test

on:
    pull_request:
        branches: 
        - 'main*'
        - 'dev*'
        - 'feature*'
jobs:
  build-and-test:
    runs-on: [self-hosted, ci]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
    
    steps:
    - uses: actions/checkout@v4
      with:
        clean: false
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore NtisPlatform.sln
    
    - name: Build solution
      run: dotnet build NtisPlatform.sln --configuration Release --no-restore
    
    - name: Run tests with coverage
      run: dotnet test NtisPlatform.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
    
    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool
    
    - name: Generate Coverage Report
      run: |
        $coverageFile = (Get-ChildItem -Path ./coverage -Recurse -Filter "coverage.cobertura.xml" | Select-Object -First 1).FullName
        reportgenerator "-reports:$coverageFile" "-targetdir:./coveragereport" "-reporttypes:MarkdownSummaryGithub;Cobertura"
        Copy-Item ./coveragereport/SummaryGithub.md ./code-coverage-results.md
    
    - name: Add Coverage PR Comment
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        recreate: true
        path: code-coverage-results.md
    
    - name: Write to Job Summary
      run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
